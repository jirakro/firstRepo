[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-pdf-merger"
version = "0.1.0"
description = "A small CLI project for merging PDF files using PyPDF2"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "PyPDF2>=3.0.0",
]

[project.scripts]
pdf-merger = "pdf_merger.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
